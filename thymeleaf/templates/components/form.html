<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="fieldLabel(id, label, addon)">
    <div class="field-label" th:if="${addon != null}">
        <label th:for="${id}" th:text="${label}"></label>
        <th:block th:replace="${addon}"></th:block>
    </div>
    <label th:unless="${addon != null}" th:for="${id}" th:text="${label}"></label>
</th:block>

<div th:fragment="inputField" class="field" th:with="invalid=${#fields.hasErrors(name)}, rules=${@fieldRules.of(#object, name)}" th:attr="data-invalid=${invalid} ? 'true' : null">
    <th:block th:replace="~{:: fieldLabel(id=${name}, label=${label}, addon=${labelAddon})}"></th:block>
    <input th:type="${type ?: 'text'}" th:field="*{__${name}__}" th:placeholder="${placeholder}" th:autocomplete="${autocomplete}"
           th:required="${required}" th:autofocus="${autofocus}" th:step="${step}" th:min="${min}"
           th:classappend="${uppercase} ? 'uppercase'"
           th:attr="aria-invalid=${invalid} ? 'true' : null, autocapitalize=${uppercase} ? 'characters' : null, list=${list}, data-rules=${rules}">
    <p th:if="${hint}" th:text="${hint}"></p>
    <p role="alert" th:if="${invalid}" th:errors="*{__${name}__}"></p>
</div>

<div th:fragment="phoneField" class="field" th:with="invalid=${#fields.hasErrors(name)}, rules=${@fieldRules.of(#object, name)}" th:attr="data-invalid=${invalid} ? 'true' : null">
    <label th:for="${name}" th:text="${label}"></label>
    <input type="tel" inputmode="tel" autocomplete="off" th:field="*{__${name}__}" th:placeholder="${placeholder ?: '+81 45 123 4567'}"
           x-data="phoneMask" x-on:input="reformat()" th:attr="aria-invalid=${invalid} ? 'true' : null, data-rules=${rules}">
    <p th:if="${hint}" th:text="${hint}"></p>
    <p role="alert" th:if="${invalid}" th:errors="*{__${name}__}"></p>
</div>

<div th:fragment="monthField" class="field" th:with="invalid=${#fields.hasErrors(name)}, rules=${@fieldRules.of(#object, name)}" th:attr="data-invalid=${invalid} ? 'true' : null">
    <th:block th:replace="~{:: fieldLabel(id=${name}, label=${label}, addon=${labelAddon})}"></th:block>
    <div class="month-picker" x-data="monthPicker" x-on:click.outside="open = false" x-on:keydown.escape="open = false">
        <div class="input-group">
            <input type="text" th:field="*{__${name}__}" placeholder="ММ.ГГГГ" inputmode="numeric" maxlength="7" autocomplete="off"
                   pattern="(0[1-9]|1[0-2])\.(19|20)\d{2}" title="Месяц и год в формате ММ.ГГГГ"
                   th:required="${required}" x-ref="input" x-on:input="format"
                   th:attr="aria-invalid=${invalid} ? 'true' : null, data-rules=${rules}">
            <span data-align="inline-end">
                <button type="button" class="btn" data-variant="ghost" data-size="icon-xs" aria-label="Выбрать месяц"
                        x-bind:aria-expanded="open" x-on:click="toggle">
                    <svg th:replace="~{components/icon :: calendar(cls=null)}"></svg>
                </button>
            </span>
        </div>
        <div data-popover aria-hidden="true" x-bind:aria-hidden="!open">
            <header>
                <button type="button" class="btn" data-variant="ghost" data-size="icon-sm" aria-label="Назад" x-on:click="shift(-1)"
                        x-bind:aria-label="view === 'years' ? 'Предыдущие годы' : 'Предыдущий год'">
                    <svg th:replace="~{components/icon :: chevron-left(cls=null)}"></svg>
                </button>
                <button type="button" class="btn" data-variant="ghost" data-size="sm" aria-label="Выбрать год" x-text="title()"
                        x-on:click="zoom" x-bind:disabled="view === 'years'"></button>
                <button type="button" class="btn" data-variant="ghost" data-size="icon-sm" aria-label="Вперёд" x-on:click="shift(1)"
                        x-bind:aria-label="view === 'years' ? 'Следующие годы' : 'Следующий год'">
                    <svg th:replace="~{components/icon :: chevron-right(cls=null)}"></svg>
                </button>
            </header>
            <div role="group" aria-label="Год" x-show="view === 'years'">
                <template x-for="y in years()" x-bind:key="y">
                    <button type="button" class="btn" data-size="sm" x-text="y"
                            x-bind:data-variant="y === year ? 'primary' : 'ghost'" x-on:click="pickYear(y)"></button>
                </template>
            </div>
            <div role="group" aria-label="Месяц" x-show="view === 'months'">
                <button type="button" class="btn" data-size="sm" th:each="m, s : ${ {'Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'} }"
                        th:text="${m}" th:data-month="${s.count}" data-variant="ghost"
                        x-on:click="pick(+$el.dataset.month)" x-bind:data-variant="selected(+$el.dataset.month) ? 'primary' : 'ghost'"></button>
            </div>
        </div>
    </div>
    <p th:if="${hint}" th:text="${hint}"></p>
    <p role="alert" th:if="${invalid}" th:errors="*{__${name}__}"></p>
</div>

<div th:fragment="dateField" class="field" th:with="invalid=${#fields.hasErrors(name)}, rules=${@fieldRules.of(#object, name)}" th:attr="data-invalid=${invalid} ? 'true' : null">
    <th:block th:replace="~{:: fieldLabel(id=${name}, label=${label}, addon=${labelAddon})}"></th:block>
    <div class="date-picker" x-data="datePicker" x-on:click.outside="open = false" x-on:keydown.escape="open = false">
        <input type="hidden" th:id="${name + '-value'}" th:field="*{__${name}__}" x-ref="value" th:x-bind:disabled="${disabledWhen}">
        <th:block th:replace="~{:: datePickerBody(id=${name}, required=${required}, invalid=${invalid}, disabledWhen=${disabledWhen}, rules=${rules})}"></th:block>
    </div>
    <p th:if="${hint}" th:text="${hint}"></p>
    <p role="alert" th:if="${invalid}" th:errors="*{__${name}__}"></p>
</div>

<div th:fragment="dateControl" class="field" th:classappend="${cls}">
    <label th:for="${id}" th:text="${label}"></label>
    <div class="date-picker" x-data="datePicker" x-on:click.outside="open = false" x-on:keydown.escape="open = false">
        <input type="hidden" th:name="${name}" th:value="${value}" x-ref="value">
        <th:block th:replace="~{:: datePickerBody(id=${id}, required=${required}, invalid=false, disabledWhen=null, rules=null)}"></th:block>
    </div>
    <p th:if="${hint}" th:text="${hint}"></p>
</div>

<th:block th:fragment="datePickerBody">
    <div class="input-group">
        <input type="text" th:id="${id}" placeholder="ДД.ММ.ГГГГ" inputmode="numeric" maxlength="10" autocomplete="off"
               title="Дата в формате ДД.ММ.ГГГГ" th:required="${required}" x-ref="input" x-on:input="format"
               th:attr="aria-invalid=${invalid} ? 'true' : null, data-rules=${rules}" th:x-bind:disabled="${disabledWhen}">
        <span data-align="inline-end">
            <button type="button" class="btn" data-variant="ghost" data-size="icon-xs" aria-label="Выбрать дату"
                    x-bind:aria-expanded="open" x-on:click="toggle" th:x-bind:disabled="${disabledWhen}">
                <svg th:replace="~{components/icon :: calendar(cls=null)}"></svg>
            </button>
        </span>
    </div>
    <div data-popover data-align="end" aria-hidden="true" x-bind:aria-hidden="!open">
        <header>
            <button type="button" class="btn" data-variant="ghost" data-size="icon-sm" aria-label="Назад" x-on:click="shift(-1)"
                    x-bind:aria-label="{days: 'Предыдущий месяц', months: 'Предыдущий год', years: 'Предыдущие годы'}[view]">
                <svg th:replace="~{components/icon :: chevron-left(cls=null)}"></svg>
            </button>
            <button type="button" class="btn" data-variant="ghost" data-size="sm" x-text="title()" x-on:click="zoom"
                    x-bind:disabled="view === 'years'" x-bind:aria-label="view === 'days' ? 'Выбрать месяц' : 'Выбрать год'"></button>
            <button type="button" class="btn" data-variant="ghost" data-size="icon-sm" aria-label="Вперёд" x-on:click="shift(1)"
                    x-bind:aria-label="{days: 'Следующий месяц', months: 'Следующий год', years: 'Следующие годы'}[view]">
                <svg th:replace="~{components/icon :: chevron-right(cls=null)}"></svg>
            </button>
        </header>
        <div role="group" aria-label="Год" data-view="years" x-show="view === 'years'">
            <template x-for="y in years()" x-bind:key="y">
                <button type="button" class="btn" data-size="sm" x-text="y"
                        x-bind:data-variant="y === year ? 'primary' : 'ghost'" x-on:click="pickYear(y)"></button>
            </template>
        </div>
        <div role="group" aria-label="Месяц" data-view="months" x-show="view === 'months'">
            <button type="button" class="btn" data-size="sm" th:each="m, s : ${ {'Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'} }"
                    th:text="${m}" th:data-month="${s.count}" data-variant="ghost"
                    x-on:click="pickMonth(+$el.dataset.month)" x-bind:data-variant="month === +$el.dataset.month ? 'primary' : 'ghost'"></button>
        </div>
        <div role="group" aria-label="День" x-show="view === 'days'">
            <span th:each="d : ${ {'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'} }" th:text="${d}"></span>
            <template x-for="cell in cells()" x-bind:key="cell.key">
                <button type="button" class="btn" data-size="sm" x-text="cell.day" x-bind:disabled="!cell.day"
                        x-bind:data-variant="cell.selected ? 'primary' : (cell.today ? 'outline' : 'ghost')"
                        x-on:click="pick(cell.day)"></button>
            </template>
        </div>
    </div>
</th:block>

<div th:fragment="textareaField" class="field" th:with="invalid=${#fields.hasErrors(name)}, rules=${@fieldRules.of(#object, name)}" th:attr="data-invalid=${invalid} ? 'true' : null">
    <label th:for="${name}" th:text="${label}"></label>
    <textarea th:field="*{__${name}__}" th:rows="${rows ?: 3}" th:placeholder="${placeholder}" th:required="${required}"
              th:attr="aria-invalid=${invalid} ? 'true' : null, data-rules=${rules}"></textarea>
    <p th:if="${hint}" th:text="${hint}"></p>
    <p role="alert" th:if="${invalid}" th:errors="*{__${name}__}"></p>
</div>

<div th:fragment="inputControl" class="field" th:id="${wrapperId}" th:classappend="${cls}">
    <label th:for="${id ?: name}" th:text="${label}"></label>
    <input th:id="${id ?: name}" th:name="${name}" th:type="${type ?: 'text'}" th:value="${value}"
           th:placeholder="${placeholder}" th:autocomplete="${autocomplete}" th:required="${required}"
           th:autofocus="${autofocus}" th:step="${step}" th:min="${min}" th:max="${max}" th:disabled="${disabled}"
           th:attr="autocapitalize=${autocapitalize}, spellcheck=${spellcheck}">
    <p th:if="${hint}" th:text="${hint}"></p>
</div>

<div th:fragment="checkbox" class="field" th:classappend="${cls}">
    <label class="label gap-2">
        <input type="hidden" th:name="${'_' + name}" value="on">
        <input type="checkbox" class="input" th:name="${name}" value="true" th:checked="${checked == true}"
               th:attr="data-model=${model}"
               x-on:change="if ($el.dataset.model) $data[$el.dataset.model] = $el.checked">
        <span th:text="${label}"></span>
    </label>
</div>

<div th:fragment="checkboxControl" class="field" th:classappend="${cls}">
    <label class="label gap-2">
        <input th:id="${id}" type="checkbox" class="input" th:name="${name}" th:value="${value ?: 'true'}"
               th:checked="${checked == true}" th:attr="data-model=${model}"
               x-on:change="if ($el.dataset.model) $data[$el.dataset.model] = $el.checked">
        <span th:text="${label}"></span>
    </label>
</div>

<div th:fragment="switch" class="field" data-orientation="horizontal" th:classappend="${cls}">
    <label th:for="${name}" th:text="${label}"></label>
    <input type="hidden" th:name="${'_' + name}" value="on">
    <input th:id="${name}" type="checkbox" role="switch" class="input" th:name="${name}" value="true"
           th:checked="${checked == true}"
           th:attr="data-model=${model}"
           x-on:change="if ($el.dataset.model) $data[$el.dataset.model] = $el.checked">
</div>

<div th:fragment="switchControl" class="field" data-orientation="horizontal" th:classappend="${cls}">
    <label th:for="${id}" th:text="${label}"></label>
    <input th:id="${id}" type="checkbox" role="switch" class="input" th:name="${name}" th:checked="${checked == true}"
           th:attr="data-model=${model}, data-fill-date=${fillDate}"
           x-on:change="
               if ($el.dataset.model) $data[$el.dataset.model] = $el.checked;
               const target = $el.dataset.fillDate &amp;&amp; document.getElementById($el.dataset.fillDate);
               if ($el.checked &amp;&amp; target &amp;&amp; !target.value) $nextTick(() =&gt; {
                   const today = new Date();
                   target.value = [today.getDate(), today.getMonth() + 1].map(n =&gt; String(n).padStart(2, '0')).join('.') + '.' + today.getFullYear();
                   target.dispatchEvent(new Event('input'));
               });
           ">
</div>

</body>
</html>
