<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<button th:fragment="trigger(id, currentLabel, placeholder, aria, invalid)" type="button" th:id="${id + '-trigger'}"
        aria-haspopup="listbox" aria-expanded="false" th:aria-controls="${id + '-listbox'}" th:aria-label="${aria}"
        th:attr="aria-invalid=${invalid} ? 'true' : null">
    <span class="truncate" data-value th:data-placeholder="${placeholder}" th:text="${currentLabel ?: placeholder}"
          th:classappend="${currentLabel == null} ? 'text-muted-foreground'"></span>
    <svg th:replace="~{components/icon :: chevron-down(cls=null)}"></svg>
</button>

<div th:fragment="popover(id, options, groups, codes, placeholder, search, create, createTypes, createLabel)" data-popover aria-hidden="true">
    <div class="input-group">
        <span><svg th:replace="~{components/icon :: search(cls=null)}"></svg></span>
        <input type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" th:aria-controls="${id + '-listbox'}"
               th:placeholder="${search ?: 'Поиск…'}" autocomplete="off" spellcheck="false">
    </div>
    <div role="listbox" th:id="${id + '-listbox'}" data-empty="Ничего не найдено">
        <div role="option" data-value="" data-force th:if="${placeholder}" th:text="${placeholder}"></div>
        <th:block th:if="${groups == null}">
            <div role="option" th:each="o : ${options}" th:data-value="${o.key}" th:text="${o.value}"
                 th:attr="data-code=${codes != null} ? ${codes.get(o.key)} : null"></div>
        </th:block>
        <div role="group" th:each="g, gs : ${groups}" th:if="${!g.value.isEmpty()}" th:aria-labelledby="${id + '-group-' + gs.index}">
            <div role="heading" th:id="${id + '-group-' + gs.index}" th:text="${g.key}"></div>
            <div role="option" th:each="o : ${g.value}" th:data-value="${o.key}" th:text="${o.value}"
                 th:attr="data-code=${codes != null} ? ${codes.get(o.key)} : null"></div>
        </div>
    </div>
    <div th:if="${create != null and canEdit}" data-quick-create
         x-data="quickCreate" th:data-url="${create}">
        <button type="button" class="btn" data-variant="ghost" data-size="sm"
                x-show="!opened" x-on:click="show()">
            <svg th:replace="~{components/icon :: plus(cls=null)}"></svg>
            <span>Добавить</span>
        </button>
        <div data-quick-create-form x-show="opened" x-cloak>
            <input x-ref="name" x-model="name" type="text" class="input" th:placeholder="${createLabel ?: 'Название'}"
                   autocomplete="off" x-bind:disabled="busy" x-on:keydown.escape.prevent="hide()">
            <button th:if="${createTypes == null}" type="button" class="btn" data-variant="default" data-size="sm"
                    x-bind:disabled="busy || !name.trim()" x-on:click="add(null)">Добавить</button>
            <button type="button" class="btn" data-variant="ghost" data-size="sm"
                    x-bind:disabled="busy" x-on:click="hide()">Отмена</button>
            <th:block th:if="${createTypes != null}">
                <p>Добавить как</p>
                <button th:each="t : ${createTypes}" type="button" class="btn" data-variant="outline" data-size="xs"
                        th:data-type="${t.key}" th:text="${t.value}" x-bind:disabled="busy || !name.trim()"
                        x-on:click="add($event.currentTarget.dataset.type)"></button>
            </th:block>
            <p role="alert" x-show="error" x-text="error"></p>
        </div>
    </div>
</div>

<button th:fragment="clear(filled)" type="button" data-clear-value aria-label="Очистить" th:hidden="${!filled}"
        x-bind:hidden="!filled" x-on:click="$el.closest('.combobox').clear()">
    <svg th:replace="~{components/icon :: x(cls=null)}"></svg>
</button>

<div th:fragment="combobox" class="field" th:with="invalid=${#fields.hasErrors(name)}, rules=${@fieldRules.of(#object, name)}, current=${#object == null ? null : #object.__${name}__}"
     th:attr="data-invalid=${invalid} ? 'true' : null">
    <label th:for="${name + '-trigger'}" th:text="${label}"></label>
    <div class="combobox" data-auto-highlight="true" th:with="currentLabel=${current != null ? options.get(current.toString()) : null}"
         th:attr="data-clearable=${clearable} ? 'true' : null"
         x-data="{ filled: false }" x-init="filled = !!$el.querySelector(':scope > input[type=hidden]').value"
         x-on:change="if ($event.detail && $event.detail.value !== undefined) { filled = !!$event.detail.value; $el.querySelector('[data-value]').classList.toggle('text-muted-foreground', !$event.detail.value) }">
        <button th:replace="~{:: trigger(id=${name}, currentLabel=${currentLabel}, placeholder=${placeholder}, aria=null, invalid=${invalid})}"></button>
        <th:block th:if="${clearable}"><button th:replace="~{:: clear(filled=${currentLabel != null})}"></button></th:block>
        <div th:replace="~{:: popover(id=${name}, options=${options}, groups=${groups}, codes=${codes}, placeholder=${placeholder}, search=${search}, create=${create}, createTypes=${createTypes}, createLabel=${createLabel})}"></div>
        <input type="hidden" th:field="*{__${name}__}" th:attr="data-rules=${rules}">
    </div>
    <p th:if="${hint}" th:text="${hint}"></p>
    <p role="alert" th:if="${invalid}" th:errors="*{__${name}__}"></p>
</div>

<div th:fragment="control" th:id="${id}" class="combobox" data-auto-highlight="true" th:classappend="${cls}"
     th:with="currentLabel=${selected != null ? options.get(selected.toString()) : null}"
     x-data x-on:change="if ($event.detail && $event.detail.value !== undefined) $el.querySelector('[data-value]').classList.toggle('text-muted-foreground', !$event.detail.value)">
    <button th:replace="~{:: trigger(id=${id}, currentLabel=${currentLabel}, placeholder=${placeholder}, aria=${aria}, invalid=false)}"></button>
    <div th:replace="~{:: popover(id=${id}, options=${options}, groups=${groups}, codes=${codes}, placeholder=${placeholder}, search=${search}, create=${create}, createTypes=${createTypes}, createLabel=${createLabel})}"></div>
    <input type="hidden" th:name="${name}" th:value="${selected}">
</div>

<div th:fragment="filter" class="field" th:attr="data-invalid=${error != null} ? 'true' : null">
    <label th:for="${id + '-trigger'}" th:text="${label}"></label>
    <div th:replace="~{:: control(id=${id}, name=${name}, options=${options}, selected=${selected}, placeholder=${placeholder}, search=${search}, groups=null, codes=null, cls=null, aria=null)}"></div>
    <p th:if="${hint}" th:text="${hint}"></p>
    <p role="alert" th:if="${error != null}" th:text="${error}"></p>
</div>
</body>
</html>
