<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
    <body>
        <div
            th:fragment="qrCodes"
            class="field"
            th:classappend="${cls}"
            th:with="invalid=${#fields.hasErrors(name)}, initial=${#object == null ? null : #object.__${name}__}"
            th:attr="data-invalid=${invalid} ? 'true' : null"
            x-init="
                const initialInputs = [...$el.querySelectorAll('[data-initial-code]')];
                if (!codes.length) codes = initialInputs.map((input) => input.value);
                initialInputs.forEach((input) => input.remove());
            "
        >
            <label th:for="${id}" th:text="${label}"></label>
            <div class="scan-field">
                <div class="input-group">
                    <span
                        ><svg th:replace="~{components/icon :: scan-line}"></svg
                    ></span>
                    <input
                        th:id="${id}"
                        type="text"
                        autocomplete="off"
                        th:autofocus="${autofocus}"
                        th:placeholder="${placeholder ?: 'Отсканируйте код'}"
                        x-model="draft"
                        x-on:keydown.enter.prevent="add()"
                    />
                    <button
                        type="button"
                        class="btn"
                        data-variant="outline"
                        data-size="sm"
                        x-on:click="add()"
                    >
                        Добавить
                    </button>
                </div>
                <button
                    th:replace="~{components/scanner :: cameraButton(target=${id})}"
                ></button>
            </div>
            <p th:if="${hint}" th:text="${hint}"></p>
            <p
                role="alert"
                th:if="${invalid}"
                th:errors="*{__${name}__}"
            ></p>
            <input
                th:each="code : ${initial}"
                type="hidden"
                th:name="${name}"
                th:value="${code}"
                data-initial-code
            />
            <ul class="flex flex-wrap gap-2" x-show="codes.length">
                <template x-for="code in codes" x-bind:key="code">
                    <li class="badge gap-1 font-mono" data-variant="secondary">
                        <span x-text="code"></span>
                        <button
                            type="button"
                            class="btn"
                            data-variant="ghost"
                            data-size="icon-sm"
                            aria-label="Убрать код"
                            x-on:click="remove(code)"
                        >
                            <svg th:replace="~{components/icon :: x}"></svg>
                        </button>
                        <input
                            type="hidden"
                            th:name="${name}"
                            x-bind:value="code"
                        />
                    </li>
                </template>
            </ul>
        </div>
    </body>
</html>
