<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
    <body>
        <div th:fragment="empty" class="empty border">
            <header>
                <figure>
                    <svg
                        th:replace="~{components/icon :: ${icon ?: 'info'}}"
                    ></svg>
                </figure>
                <h2 th:text="${title}"></h2>
                <p th:if="${text}" th:text="${text}"></p>
            </header>
            <th:block th:if="${action}">
                <footer th:insert="${action}"></footer>
            </th:block>
        </div>

        <tr th:fragment="resultRow" th:if="${show}">
            <td
                class="empty-result"
                th:colspan="${columns}"
                th:text="${text} ?: 'Ничего не найдено'"
            ></td>
        </tr>

        <li
            th:fragment="resultItem"
            th:if="${show}"
            class="empty-result"
            th:text="${text} ?: 'Ничего не найдено'"
        ></li>
    </body>
</html>
